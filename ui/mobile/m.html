<!doctype html>
<html lang="th" translate="no">
<head>
<meta charset="utf-8" />
<meta name="google" content="notranslate" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#020208" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>maw</title>
<!--
  Phone UI for maw, laid out like Superset: projects → workspace → rooms as tabs (+ open a new room).
  Rooms = every Superset terminal (Claude, Codex, any agent, plain shell) + tmux panes running Claude.
  Talks only to /mobile/* (src/mobile/api.ts). Plan: ~/oracle/ψ/incubate/Soul-Brews-Studio/maw-js/PLAN-maw-mobile.md
  Source: ui/mobile/m.html in the fork → copied to ~/.maw/ui/dist/m.html
-->
<style>
  :root {
    --bg: #020208; --card: #0d0f1a; --card2: #141729; --line: #1f2337; --text: #e6e8f2; --dim: #8a90a8;
    --working: #22c55e; --waiting: #f59e0b; --done: #38bdf8; --idle: #64748b; --ended: #3b3f52; --asleep: #3b3f52; --accent: #60a5fa; --danger: #ef4444;
    --font: -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", "Sarabun", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, "Noto Sans Mono", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
  body { padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .app { display: flex; flex-direction: column; height: 100%; padding-top: env(safe-area-inset-top); }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex: none; }
  #ext-room-actions { flex: none; max-width: 44%; }
  /* หน้าตาแบบคลีน — หัวจอห้อง + ลิ้นชัก (แถบเดิมซ่อน แต่ยังอยู่ให้ refreshTabs อ่าน) */
  #app:has(> .uiclean) > .seg, #app:has(> .uiclean) > .wsbar, #app:has(> .uiclean) > .tabs, #app:has(> .uiclean) > .roomhead { display: none !important; }
  header.chd { gap: 2px; padding: 6px 6px 6px 4px; border-bottom: 0; }
  header.chd .cb { min-width: 40px; padding: 0; background: none; color: var(--text); position: relative; }
  header.chd #ext-room-actions { max-width: 30%; }
  .chd-t { flex: 1; min-width: 0; text-align: center; background: none; color: var(--text); padding: 2px 4px; display: grid; gap: 1px; }
  .chd-t b { font-size: 13.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chd-t .sub { display: block; font-size: 10.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chd-t #room-status { display: inline-flex; gap: 4px; align-items: center; vertical-align: middle; }
  /* สถานะเครื่องบนหัวจอคลีน: เหลือแค่ไอคอนแมว (แตะแล้วเปิดแผงเหมือนเดิม) */
  header.chd .rc { padding: 0 6px; min-width: 0; } header.chd .rc > :not(.cat-box):not(.rc-trav) { display: none; }
  .cbd { position: absolute; top: 3px; right: 2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; background: #22d3ee; color: #031016; font: 800 10.5px/17px var(--font); font-style: normal; text-align: center; }
  /* หน้าหลักแบบคลีน (แบบ A, 23 พ.ย. 69): หัวจอแถวเดียว · ค้นหา + ＋ · ทางลัดไอคอนแถวเดียว · "กำลังทำ" · รายการโปรเจคแบน */
  #app:has(> .uiclean) .homehead { border-bottom: 0; }
  #app:has(> .uiclean) .homehead h1 { font-size: 15px; }
  #app:has(> .uiclean) .homehead .rc { background: none; border: 0; height: 34px; padding: 0 4px; font-size: 11.5px; }
  #app:has(> .uiclean) .homehead .iconbtn { background: none; border: 0; }
  #app:has(> .uiclean) .cx-home { display: none !important; }
  /* หัวจอหน้าเมนู (PR · Mind · เอกสาร …) แบบคลีน: ← ไม่มีกล่อง · ชื่อหน้าไม่มี emoji · แมวเหลือไอคอนเดียว */
  header.phd { gap: 4px; padding-inline: 4px 10px; border-bottom: 0; }
  header.phd h1 { flex: 1; min-width: 0; font-size: 14px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header.phd #back { background: none; border: 0; min-width: 38px; }
  header.phd .rc { background: none; border: 0; padding: 0 6px; min-width: 0; } header.phd .rc > :not(.cat-box):not(.rc-trav) { display: none; }
  /* หน้า Herdr */
  .hd-acts { display: flex; gap: 8px; margin: 0 0 14px; }
  .hd-acts button { flex: 1; height: 38px; border-radius: 12px; border: 0; background: var(--card); color: var(--text); font: 600 12.5px var(--font); }
  .hd-acts button:first-child { background: var(--accent); color: #04101f; }
  .hsrch { display: flex; gap: 8px; margin: 2px 0 14px; }
  .hsrch label { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 12px; padding: 0 12px; height: 38px; color: var(--dim); }
  .hsrch input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: 13px var(--font); padding: 0; }
  .hsrch .hadd { width: 38px; height: 38px; flex: none; border-radius: 12px; background: var(--card); border: 0; color: var(--text); display: grid; place-items: center; }
  .happs { display: grid; grid-template-columns: repeat(auto-fit, minmax(48px, 1fr)); gap: 4px; margin: 0 0 16px; }
  .happ { position: relative; display: grid; justify-items: center; gap: 4px; background: none; border: 0; padding: 0; color: var(--dim); font: 10.5px var(--font); min-width: 0; }
  .happ i { width: 40px; height: 40px; border-radius: 13px; background: var(--card); display: grid; place-items: center; color: var(--text); font-style: normal; font-size: 17px; }
  .happ > span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .happ .n { position: absolute; top: -3px; left: calc(50% + 9px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--card2, #23232a); border: 1px solid var(--line); color: var(--text); font: 700 9.5px/14px var(--font); }
  .hsec { display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px; margin: 0 0 6px; font-size: 11px; color: var(--dim); }
  .hsec b { font-weight: 600; letter-spacing: .3px; }
  .hbox { background: var(--card); border-radius: 14px; overflow: hidden; margin: 0 0 16px; }
  .hrow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; background: none; border: 0; color: var(--text); text-align: left; font: inherit; }
  .hrow + .hrow { border-top: 1px solid var(--line); }
  .hrow:active { background: #ffffff08; }
  .hrow .t { flex: 1; min-width: 0; display: grid; }
  .hrow .t b { font-size: 13px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hrow .t small { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hrow .s { font-size: 10.5px; color: var(--dim); white-space: nowrap; }
  .hrow .s.working { color: #4ade80; } .hrow .s.waiting { color: #f59e0b; }
  .hmore { display: block; margin: -6px auto 12px; background: none; border: 0; color: var(--accent); font: 12px var(--font); padding: 6px 10px; }
  .drw-bg { position: fixed; inset: 0; z-index: 60; background: #0000; transition: background .2s; }
  .drw-bg.in { background: #0009; }
  .drw { position: absolute; top: 0; bottom: 0; left: 0; width: min(86vw, 380px); background: var(--bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 12px) 0 calc(env(safe-area-inset-bottom, 0px) + 8px); transform: translateX(-100%); transition: transform .22s ease; }
  .drw-bg.in .drw { transform: none; }
  /* เดสก์ท็อป (กว้าง ≥ 1000px · แบบคลีน): ลิ้นชักเปิดค้างเป็นแถบซ้ายแบบแอป AI ทั่วไป · เนื้อหาเลื่อนไปขวา · ข้อความอยู่กลางกว้างพออ่าน */
  /* ⌘K แผงค้นทุกอย่าง */
  .pal-bg { position: fixed; inset: 0; z-index: 80; background: #000a; display: flex; justify-content: center; align-items: flex-start; padding-top: 10vh; }
  .pal { width: min(640px, calc(100vw - 24px)); max-height: 72vh; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 24px 64px #000a; }
  .pal input { border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--text); font: 15px var(--font); padding: 14px 16px; outline: 0; }
  .pal-l { overflow-y: auto; padding: 6px 0; }
  .pal-h { font-size: 10.5px; color: var(--dim); padding: 8px 16px 4px; letter-spacing: .3px; }
  .pal-r { display: flex; align-items: baseline; gap: 10px; width: 100%; padding: 8px 16px; background: none; border: 0; color: var(--text); text-align: left; font: 13px var(--font); }
  .pal-r .t { flex: none; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .pal-r .s { flex: 1; min-width: 0; color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pal-r.msgr { display: grid; gap: 2px; } .pal-r.msgr .s { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .pal-r.on { background: #ffffff10; } .pal-r mark { background: #f59e0b44; color: inherit; border-radius: 3px; }
  .pal-f { font-size: 10.5px; color: var(--dim); padding: 8px 16px; border-top: 1px solid var(--line); }
  .msg.flash { animation: msgflash 1.6s ease; } @keyframes msgflash { 0%, 40% { background: #f59e0b22; } 100% { background: transparent; } }
  .keys-t { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 13px; } .keys-t kbd { font: 12px var(--mono); background: var(--card2, #23232a); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
  .drw-bg.pinned { right: auto; width: 300px; z-index: 40; background: none !important; }
  .drw-bg.pinned .drw { width: 300px; transform: none; transition: none; }
  body.drw-pinned { padding-left: 300px; }
  body.drw-pinned #app > :not(header):not(.uiclean):not(.screenwrap) { width: min(calc(100% - 24px), 900px); margin-left: auto; margin-right: auto; box-sizing: border-box; }
  /* แชทเลื่อนได้เต็มความกว้าง (แถบเลื่อนชิดขอบจอแบบแอป AI) แต่ข้อความอยู่คอลัมน์กลาง 900px */
  body.drw-pinned #app > .screenwrap #screen { padding-inline: max(16px, calc((100% - 876px) / 2)); }
  /* แถบเลื่อนบาง ไม่มีราง — แชท · แถบซ้าย · หน้าอื่น */
  #screen, .drw-l, main, .pgmain { scrollbar-width: thin; scrollbar-color: #3a3a46 transparent; }
  #screen::-webkit-scrollbar, .drw-l::-webkit-scrollbar, main::-webkit-scrollbar, .pgmain::-webkit-scrollbar { width: 8px; height: 8px; }
  #screen::-webkit-scrollbar-track, .drw-l::-webkit-scrollbar-track, main::-webkit-scrollbar-track, .pgmain::-webkit-scrollbar-track { background: transparent; }
  #screen::-webkit-scrollbar-thumb, .drw-l::-webkit-scrollbar-thumb, main::-webkit-scrollbar-thumb, .pgmain::-webkit-scrollbar-thumb { background: #3a3a46; border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
  #screen::-webkit-scrollbar-thumb:hover, .drw-l::-webkit-scrollbar-thumb:hover { background-color: #555564; }
  body.drw-pinned #app > .spin { margin-left: auto !important; margin-right: auto !important; padding-inline: 14px; }   /* .spin มี margin !important ของมันเอง */
  .drw-bg.pinned .drw-tabs { flex-wrap: wrap; row-gap: 6px; }   /* แถบซ้ายกว้าง 300px: ไฟล์ · Git · ห้องเก่า · Superset ขึ้นบรรทัดใหม่แทนล้น */
  .drw-s { margin: 4px 14px 8px; height: 42px; border-radius: 13px; background: var(--card); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--dim); }
  .drw-s input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--text); font: 16px var(--font); }
  .drw-top { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 14px 8px; }
  .drw-top button { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; height: 40px; border-radius: 12px; background: var(--card); color: var(--text); font: 14px var(--font); }
  .drw-top .cbd { position: static; }
  .drw-tabs { display: flex; gap: 6px; align-items: center; padding: 0 14px 10px; overflow-x: auto; flex: none; scrollbar-width: none; border-bottom: 1px solid var(--line); }
  .drw-tabs span { flex: none; font-size: 12px; color: var(--dim); margin-right: 2px; }
  .drw-tabs button { flex: none; height: 30px; padding: 0 12px; border-radius: 99px; background: var(--card2); color: var(--text); font: 13px var(--font); }
  .drw-l:has(.drw-p) { display: block; }
  .drw-p { border-radius: 14px; margin: 0 0 6px; background: var(--card); }
  .drw-ph { width: 100%; display: flex; align-items: center; gap: 8px; padding: 12px 12px; background: none; color: var(--text); text-align: left; }
  .drw-ph .chev { flex: none; color: var(--dim); transition: transform .15s; font-size: 16px; width: 12px; }
  .drw-p.open .drw-ph .chev, .drw-p.found .drw-ph .chev { transform: rotate(90deg); }
  .drw-ph { background: var(--card2); border-radius: 14px; }
  .drw-p.open .drw-ph, .drw-p.found .drw-ph { border-radius: 14px 14px 0 0; }
  .drw-ph .pn { flex: 1; min-width: 0; font: 700 13.5px var(--font); color: #fff; letter-spacing: .01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drw-ph .s { flex: none; font-size: 11.5px; color: var(--dim); }
  .drw-ph .s.w, .drw-ph .s.k { color: var(--text); }
  .drw-pr { display: none; padding: 0 6px 6px; } .drw-p.open .drw-pr, .drw-p.found .drw-pr { display: grid; gap: 1px; }
  .drw-pr { padding-top: 4px !important; }
  .drw-p .drw-r { padding: 6px 10px 6px 16px; font-size: 11.5px; color: #aab0c6; }
  .drw-p .drw-r .a, .drw-p .drw-r .br { font-size: 10.5px; opacity: .8; }
  .drw-p .drw-r.on { color: #fff; font-weight: 600; }
  .drw-p .drw-r.on { background: var(--card2); }
  .drw-nav { display: grid; gap: 1px; padding: 0 8px 8px; border-bottom: 1px solid var(--line); }
  .drw-nav button { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 11px; background: none; color: var(--text); font: 15px var(--font); text-align: left; position: relative; }
  .drw-nav .cbd { position: static; margin-left: auto; }
  .drw-l { flex: 1; overflow-y: auto; padding: 6px 8px; display: grid; gap: 1px; align-content: start; }
  .drw-h { font-size: 12px; color: var(--dim); padding: 12px 10px 4px; letter-spacing: .03em; display: flex; align-items: center; gap: 6px; }
  .drw-h.busy { color: var(--text); font-weight: 600; }
  .drw-r { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 11px; background: none; color: var(--text); font: 14.5px var(--font); text-align: left; min-width: 0; }
  .drw-r.on { background: var(--card2); }
  .drw-r .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drw-r .br, .drw-r .a { flex: none; font: 11.5px var(--mono); color: var(--dim); }
  /* ขั้น 2: ช่องพิมพ์การ์ดมน + แผ่น "+" (แถวปุ่มลัดเดิมซ่อน แต่ยังอยู่ให้แผ่นกดแทน) */
  #app:has(> .uiclean) > .keys { display: none !important; }
  #app:has(> .uiclean) .composer { display: grid !important; grid-template-columns: auto 1fr auto auto; gap: 8px 6px !important; margin: 4px 10px calc(8px + env(safe-area-inset-bottom)); padding: 10px 8px 8px 10px !important; border: 1px solid var(--line); border-radius: 24px; background: var(--card); }
  #app:has(> .uiclean) .composer textarea { grid-column: 1 / -1; grid-row: 1; background: none !important; border: 0 !important; padding: 4px 6px !important; font-size: 16px; min-height: 34px; outline: none; }
  #app:has(> .uiclean) .composer #clip, #app:has(> .uiclean) .composer #cam { display: none !important; }
  #app:has(> .uiclean) .composer .cplus { grid-column: 1; grid-row: 2; border-radius: 50% !important; color: var(--text); background: var(--card2); border-color: transparent; }
  #app:has(> .uiclean) .composer #mic { grid-column: 3; grid-row: 2; border-radius: 50% !important; border-color: transparent; background: var(--card2); }
  #app:has(> .uiclean) .composer .send { grid-column: 4; grid-row: 2; width: 42px !important; height: 42px !important; border-radius: 50% !important; }
  /* ขั้น 3: ข้อความ AI ไม่มีกรอบ · ข้อความเราเป็นฟองเทา · ขั้นตอน agent เป็นบรรทัดบาง (บรรทัด .who ที่มีตัวหมุนตอนทำงานคงไว้) */
  #app:has(> .uiclean) .msg.ai .bubble { background: none; border: 0; border-radius: 0; padding: 2px 4px; font-size: 12.5px; line-height: 1.6; }
  #app:has(> .uiclean) .msg.ai .who { margin: 0 4px 2px; }
  #app:has(> .uiclean) .msg.me .bubble { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; border-radius: 20px 20px 6px 20px; padding: 7px 12px; font-size: 12.5px; font-weight: 500; box-shadow: 0 4px 14px #2563eb33; }
  #app:has(> .uiclean) .msg.me:not(.queued):not(.canceled):not(.pend) > .who { display: none; }
  #app:has(> .uiclean) .msg { margin: 18px 0 4px; }
  #app:has(> .uiclean) details.tool { margin: 1px 0 1px 2px; }
  #app:has(> .uiclean) details.tool > summary { background: none; border: 0; padding: 5px 4px; gap: 8px; color: var(--dim); }
  #app:has(> .uiclean) details.tool[open] > summary { background: var(--card); border-radius: 10px 10px 0 0; }
  #app:has(> .uiclean) details.tool .tn { font: 600 10.5px var(--mono); }
  #app:has(> .uiclean) details.tool > summary, #app:has(> .uiclean) details.tgroup > summary { font-size: 11px; padding-top: 2px; padding-bottom: 2px; }
  #app:has(> .uiclean) details.tool .tsum { font-size: 10.5px; }
  #app:has(> .uiclean) details.tool.agent > summary { background: none; color: #c4b5fd; }
  #app:has(> .uiclean) details.tgroup { margin: 2px 0 2px 2px; }
  #app:has(> .uiclean) details.tgroup.prev > summary { justify-content: flex-start; gap: 8px; }
  #app:has(> .uiclean) details.tgroup.prev .gsum { flex: none; }
  #app:has(> .uiclean) details.tgroup.prev[open] > summary .chev { transform: rotate(90deg); }
  #app:has(> .uiclean) details.tgroup > summary { background: none !important; border: 0 !important; padding: 5px 4px; color: var(--dim); }
  #app:has(> .uiclean) details.tgroup.err > summary .gsum::after { content: ""; }
  .macts { display: flex; gap: 14px; margin: 4px 4px 0; } .macts button { background: none; color: var(--dim); padding: 4px; border-radius: 8px; opacity: .7; } .macts button:active { opacity: 1; color: var(--text); }
  .pls-bg { position: fixed; inset: 0; z-index: 60; background: #0000; transition: background .2s; }
  .pls-bg.in { background: #0008; }
  .pls { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 8px 14px calc(14px + env(safe-area-inset-bottom)); display: grid; gap: 10px; transform: translateY(100%); transition: transform .22s ease; max-height: 75vh; overflow-y: auto; }
  .pls-bg.in .pls { transform: none; }
  .pls-g { width: 38px; height: 4px; border-radius: 99px; background: var(--line); margin: 2px auto 4px; }
  .pls-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pls-t { display: grid; justify-items: center; gap: 4px; padding: 12px 4px; border-radius: 14px; background: var(--card2); color: var(--dim); font: 13px var(--font); }
  .pls-t span { font-size: 21px; color: var(--text); }

<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<script>
const ST = { working: "กำลังทำ", waiting: "รอคำตอบ", done: "เสร็จแล้ว", idle: "ว่าง", unknown: "ยังไม่ทราบสถานะ", ended: "ปิดแล้ว", asleep: "ยังไม่เปิด" };
const ICON = { claude: "✳ Claude", codex: "◎ Codex", opencode: "OpenCode", gemini: "✦ Gemini", copilot: "Copilot", amp: "Amp", "cursor-agent": "Cursor", droid: "Droid", pi: "Pi", agy: "Agy", mastracode: "Mastra" };
const $app = document.getElementById("app");
let state = { projects: [], project: null, ws: null, room: null, follow: true, showEmpty: false, presets: [], mode: "chat", chat: null, open: new Set(), pview: "rooms", fpath: "", fview: null, gview: null, files: [] };
let timer = null;
// per-room chat memory so switching rooms paints instantly (last 12 rooms)
const chatCache = new Map(), chatHtmlCache = new Map();
// Writer generation is deliberately strict: capability/status changes are not identity changes.
function chatBinding(ws, room) {
  const r = state.projects.flatMap(p => p.workspaces).find(w => w.id === ws)?.rooms.find(r => r.id === room);
  return JSON.stringify([ws, room, r?.agent ?? null, r?.generation ?? null, r?.claudeSessionId ?? null, r?.transportKind ?? null, r?.logicalRoomId ?? null, r?.protocolBinding ? [r.protocolBinding.agent, r.protocolBinding.nativeId, r.protocolBinding.generation, r.protocolBinding.model ?? null, r.protocolBinding.route ?? null] : null]);
}
function herdrCanCompose(room) { return !!room && !["ended", "asleep"].includes(room.status) && !!(room.capabilities?.prompt || room.capabilities?.answer); }
function syncHerdrControls(room) {
  if (!String(state.ws).startsWith("herdr:")) return;
  const allowed = herdrCanCompose(room), msg = document.getElementById("msg"), send = document.getElementById("send");
  if (send) send.disabled = !allowed || !!msg?._continuityCapturing || (!msg?.value.trim() && !state.files.length);
  // Keep the composer mounted for local drafts, while native actions remain capability gated.
  document.querySelectorAll("[data-k]").forEach(b => b.disabled = b.dataset.k === "ctrlc" ? !room?.capabilities?.stop : !room?.capabilities?.keys);
}
// warm the other agent rooms of this workspace in the background → the first switch paints at once
let prefetching = null;
async function prefetchRooms(w) {
  if (prefetching === w.id || document.hidden) return; prefetching = w.id;
  try {
    for (const r of w.rooms.filter(r => r.agent && r.status !== "asleep" && r.id !== state.room && !chatHtmlCache.has(chatBinding(w.id, r.id))).slice(0, 4)) {
      if (state.ws !== w.id || document.hidden) break;
      const binding = chatBinding(w.id, r.id);
      const c = await api(`/rooms/${encodeURIComponent(w.id)}/${encodeURIComponent(r.id)}/chat?limit=150${isHerdr(w.id) ? "" : "&lite=1"}`).catch(() => null);
      if (!c || c.kind !== "messages" || state.ws !== w.id || chatBinding(w.id, r.id) !== binding || chatHtmlCache.has(binding) || state.room === r.id) continue;
      const items = new Map(c.items.map(it => [it.i, it])), list = [...items.values()].sort((a, b) => a.i - b.i);
      chatCache.set(binding, { binding, conversation: c.conversation, room: r.id, epoch: c.epoch, start: c.start, total: c.total, items });
      const keep = state.room; state.room = r.id;   // labels (Claude / Codex) come from the room being drawn
      try { rememberChatHtml(binding, (c.start > 0 ? `<button class="older" id="older">โหลดข้อความก่อนหน้า (อีก ${c.start})</button>` : `<div class="sys">— จุดเริ่มของห้องนี้ —</div>`) + renderList(list)); }
      finally { state.room = keep; }
      await new Promise(res => setTimeout(res, 300));   // gentle on 4G
    }
  } finally { prefetching = null; }
}
function rememberChatHtml(room, html) {
  chatHtmlCache.delete(room); chatHtmlCache.set(room, html);
  while (chatHtmlCache.size > 12) { const k = chatHtmlCache.keys().next().value; chatHtmlCache.delete(k); chatCache.delete(k); }
}
// Extension points for feature packs in ui/mobile/ext/*.js (PLAN-maw-mobile.md §9):
//   onRoom({p,w,room})  after a room view is drawn · onPoll({p,w,room,live}) every ~2.5 s in a room
//   onHome()  after home is drawn · onComposer({w,room,msg})  composer ready · tabs [{key,label,render(w, el)}] extra project tabs
//   keys [{label, cls, onClick({w,room})}] extra buttons at the start of the quick-keys row
window.mawExt = { onRoom: [], onPoll: [], onHome: [], onComposer: [], beforeSend: [], tabs: [], keys: [], pages: [] };
// pages [{key, icon, title, summary() → {text, badge?, tone?}, mount(el)}] — a tile in the home "เมนู" grid that opens its own screen
const extCall = (name, arg) => { for (const f of mawExt[name]) { try { f(arg); } catch (e) { console.error("[ext]", name, e); } } };
/** Helpers for packs: type into / press a key in the open room. */
async function roomSend(text) {
  if (isHerdr(state.ws)) {
    const room = roomBinding(state.ws, state.room);
    return api(`/rooms/${encodeURIComponent(state.ws)}/${encodeURIComponent(state.room)}/send`, { method: "POST", body: JSON.stringify({ text, id: requestId(), generation: room?.generation }) });
  }
  await api(`/rooms/${encodeURIComponent(state.ws)}/${encodeURIComponent(state.room)}/send`, { method: "POST", body: JSON.stringify({ text }) }); }
async function roomKey(key) { if (isHerdr(state.ws)) return herdrKey(state.ws, state.room, key); await api(`/rooms/${encodeURIComponent(state.ws)}/${encodeURIComponent(state.room)}/send`, { method: "POST", body: JSON.stringify({ key }) }); }

const store = { get: k => { try { return localStorage.getItem(k) } catch { return null } }, set: (k, v) => { try { localStorage.setItem(k, v) } catch {} }, del: k => { try { localStorage.removeItem(k) } catch {} } };
const fromHash = location.hash.match(/t=([a-f0-9]{32,})/);
if (fromHash) { store.set("maw-mobile-token", fromHash[1]); history.replaceState(null, "", location.pathname); }
store.del("maw-desktop-ui"); store.del("maw-view-trail"); // opening this page = phone UI wanted again (installed app always starts here)

// timing of every request as the phone sees it (network + Mac), sent home every 30 s → GET /mobile/perf on the Mac
const perf = new Map();
function perfNote(path, ms) {
  const k = path.split("?")[0].replace(/\/[0-9a-f-]{20,}|\/%25\d+|\/%\d+|\/dir:[^/]+|\/[0-9a-f]{16}\b/gi, "/:id");
  const a = perf.get(k) || []; a.push(Math.round(ms)); if (a.length > 50) a.shift(); perf.set(k, a);
}
setInterval(() => {
  if (!perf.size || document.hidden) return;
  const rows = [...perf].map(([k, a]) => { const s = [...a].sort((x, y) => x - y); return { k, n: a.length, med: s[s.length >> 1], max: s[s.length - 1] }; });
  perf.clear();
  fetch("/mobile/perf", { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + (store.get("maw-mobile-token") || "") }, body: JSON.stringify({ rows, ua: navigator.userAgent.slice(0, 80) }) }).catch(() => {});
}, 30_000);
async function api(path, opts = {}) {
  const t0 = performance.now();
  try { return await ((!opts.method || opts.method === "GET") && !opts.headers && BATCHABLE.test(path) ? batched(path) : apiRaw(path, opts)); }
  finally { perfNote(path, performance.now() - t0); }
}
// ประหยัดเน็ต: GET ที่ poll พร้อมกัน (projects · แชท · suggestion · mode · prompt) ภายใน 15 ms ส่งเป็นคำขอเดียว /batch
// แต่ละอันได้ผล/ข้อผิดพลาดของตัวเองเหมือนขอแยก · server เก่าที่ไม่มี /batch หรือคำขอรวมล้ม → ขอแยกตามเดิม
const BATCHABLE = /^\/(projects|system|rooms\/(?!herdr)[^/?]+\/[^/?]+\/(chat|suggestion|mode|prompt))(\?|$)/;
const batchQ = []; let batchOff = false;
const batchTags = new Map();   // path → { etag, body } of the last full answer — sent back as e= so unchanged parts return 304
function batched(path) {
  if (batchOff || !net.online) return apiRaw(path);
  return new Promise((res, rej) => { batchQ.push({ path, res, rej }); if (batchQ.length === 1) setTimeout(flushBatch, 15); });
}
async function flushBatch() {
  const q = batchQ.splice(0), each = () => q.forEach(x => apiRaw(x.path).then(x.res, x.rej));
  if (q.length < 2) return each();
  let r;
  try { r = await apiRaw("/batch?" + q.map(x => "p=" + encodeURIComponent(x.path) + "&e=" + encodeURIComponent(batchTags.get(x.path)?.etag || "")).join("&")); }
  catch (e) { if (e.status === 404) batchOff = true; return each(); }
  q.forEach((x, k) => {
    const it = r.results?.[k];
    if (!it) return apiRaw(x.path).then(x.res, x.rej);
    if (it.status === 304) { const kept = batchTags.get(x.path); return kept ? x.res(kept.body) : apiRaw(x.path).then(x.res, x.rej); }
    if (it.status === 401) { renderLogin(); return x.rej(new Error("unauthorized")); }
    if (it.status !== 200 || it.body?.ok === false) { const e = new Error(it.body?.error || ("HTTP " + it.status)); e.body = it.body; e.status = it.status; return x.rej(e); }
    if (!liveOnlyPath(x.path)) offlineCache.put(x.path, it.body);
    if (it.etag) { batchTags.set(x.path, { etag: it.etag, body: it.body }); if (batchTags.size > 60) batchTags.delete(batchTags.keys().next().value); }
    x.res(it.body);
  });
}
const liveOnlyPath = path => /^\/rooms\/herdr(?::|%3a)[^/]*\/[^/]+\/chat(?:\?|$)/i.test(path) || /^\/herdr\//.test(path) || /\/delivery(?:\/|$)|\/prompt(?:\/|$)|\/continuity(?:\/|$)/.test(path) || /^\/batch\?/.test(path);
async function apiRaw(path, opts = {}) {
  // The optional protocol pack owns this awaited fence, including old permission/key closures.
  await window.mawContinuityTransport?.guard(path);
  const get = !opts.method || opts.method === "GET", cacheable = get && !liveOnlyPath(path);
  // offline: what was last read stays readable (net.check() is what notices the link coming back)
  if (get && !net.online) { const hit = cacheable && await offlineCache.get(path); if (hit) return hit; throw net.error(); }
  let res;
  try {
    // a GET that hangs (Mac asleep, Tailscale gone) would freeze the room — give up and use the copy instead
    res = await fetch("/mobile" + path, { ...(get ? { signal: AbortSignal.timeout(30_000) } : {}), ...opts, headers: { "content-type": "application/json", authorization: "Bearer " + (store.get("maw-mobile-token") || ""), ...(opts.headers || {}) } });
    if (net.gatewayDown(res)) throw Object.assign(new Error("maw ไม่ตอบ"), { gateway: true });
  } catch (e) {
    if (!net.isNetErr(e)) throw e;
    // one slow or dropped request (4G hiccup) is not "offline": only when the Mac's ping fails too
    if (await net.probe()) {
      if (cacheable) { const hit = await offlineCache.get(path); if (hit) return hit; }
      throw e;
    }
    net.down();
    if (cacheable) { const hit = await offlineCache.get(path); if (hit) return hit; }
    throw net.error();
  }
  net.up();
  if (res.status === 401) { renderLogin(); throw new Error("unauthorized"); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok || body.ok === false) { const e = new Error(body.error || ("HTTP " + res.status)); e.body = body; e.status = res.status; throw e; }
  if (cacheable) offlineCache.put(path, body);
  return body;
}

// ── offline: last data kept on the phone, a status bar, messages wait for the link ──
// A GET answered from here carries _offlineAt (when it was fetched) so a screen can say how old it is.
const offlineCache = (() => {
  const DB = "maw-offline", OS = "api", MAX = 300, BIG = 3_000_000;
  let dbp = null;
  const db = () => dbp ??= new Promise((res, rej) => {
    if (!("indexedDB" in window)) return rej(new Error("no indexedDB"));
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(OS);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }).catch(e => { dbp = Promise.reject(e); throw e; });
  const tx = async (mode, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction(OS, mode); const out = fn(t.objectStore(OS)); t.oncomplete = () => res(out?.result); t.onerror = () => rej(t.error); }); };
  let writes = 0;
  return {
    async get(path) {
      try { const v = await tx("readonly", s => s.get(path)); return v ? { ...v.body, _offlineAt: v.at } : null; } catch { return null; }
    },
    put(path, body) {
      // live state worth showing offline; skip what only makes sense live
      // (suggestion = the live typing/spinner line — an old one would claim the agent is working)
      // (prompt = a dialog open right now — an old one shown offline would invite answering something already gone)
      if (liveOnlyPath(path)) return;
      if (/^\/(version|perf|health)\b|\/suggestion\?|\/prompt$/.test(path)) return;
      let size = 0; try { size = JSON.stringify(body).length; } catch { return; }
      if (size > BIG) return;
      tx("readwrite", s => s.put({ at: Date.now(), body }, path)).catch(() => {});
      if (++writes % 50 === 0) this.trim();
    },
    async trim() {
      try {
        const rows = []; await tx("readonly", s => { const c = s.openCursor(); c.onsuccess = () => { const k = c.result; if (k) { rows.push([k.key, k.value.at]); k.continue(); } }; return c; });
        if (rows.length <= MAX) return;
        rows.sort((a, b) => a[1] - b[1]);
        await tx("readwrite", s => { for (const [k] of rows.slice(0, rows.length - MAX)) s.delete(k); });
      } catch { /* best effort */ }
    },
  };
})();

const net = {
  online: true, since: Date.now(), lastLive: Date.now(), checking: false,
  isNetErr: e => e?.name === "TypeError" || e?.name === "AbortError" || e?.name === "TimeoutError" || e?.gateway,
  gatewayDown: r => r.status >= 502 && r.status <= 504,
  /** true = the Mac answers its ping (no auth needed to count: any non-gateway reply means it is reachable) */
  async probe() {
    if (!navigator.onLine) return false;
    try { const r = await fetch("/mobile/health", { cache: "no-store", signal: AbortSignal.timeout(6_000), headers: { authorization: "Bearer " + (store.get("maw-mobile-token") || "") } }); return !this.gatewayDown(r); }
    catch { return false; }
  },
  error() { const e = new Error(navigator.onLine ? "ต่อ Mac ไม่ได้" : "มือถือไม่มีเน็ต"); e.offline = true; return e; },
  down() { if (!this.online) return; this.online = false; this.since = Date.now(); paintNet(); this.check(); },
  up() {
    this.lastLive = Date.now();
    if (this.online) return;
    this.online = true; this.since = Date.now(); paintNet(); toast("🟢 กลับมาออนไลน์แล้ว");
    flushWaiting();
  },
  /** While offline: a cheap ping every 5 s (no auth) until the Mac answers. */
  async check() {
    if (this.online || this.checking) return; this.checking = true;
    try {
      while (!this.online) {
        // any answer = the Mac is reachable again (a 401 is then shown by the next real request)

// ── commit graph: lanes like VS Code's Source Control Graph ──
const LANE = ["#3b82f6", "#f59e0b", "#a855f7", "#22c55e", "#ec4899", "#14b8a6", "#ef4444", "#eab308"];
function layoutGraph(rows) {
  const lanes = []; let max = 1;
  for (const c of rows) {
    let col = lanes.indexOf(c.sha);
    if (col < 0) { col = lanes.indexOf(null); if (col < 0) col = lanes.length; lanes[col] = c.sha; }
    const before = lanes.slice();
    for (let k = 0; k < lanes.length; k++) if (k !== col && lanes[k] === c.sha) lanes[k] = null; // branches converging here
    lanes[col] = c.parents[0] || null;
    const merges = c.parents.slice(1).map(p => { let k = lanes.indexOf(p); if (k < 0) { k = lanes.indexOf(null); if (k < 0) k = lanes.length; lanes[k] = p; } return k; });
    while (lanes.length && lanes[lanes.length - 1] == null) lanes.pop();
    c.g = { col, before, after: lanes.slice(), merges };
    max = Math.max(max, before.length, lanes.length);
  }
  return max;
}
function graphSvg(c, width, head) {
  const H = 30, m = H / 2, X = k => 10 + k * 12, col = k => LANE[k % LANE.length];
  const { before, after, merges } = c.g; let d = "";
  before.forEach((s, k) => { if (s == null) return; d += s === c.sha ? `<path d="M${X(k)} 0 C${X(k)} ${m / 2} ${X(c.g.col)} ${m / 2} ${X(c.g.col)} ${m}" stroke="${col(k)}"/>` : `<path d="M${X(k)} 0 V${m}" stroke="${col(k)}"/>`; });
  after.forEach((s, k) => {
    if (s == null) return;
    if (k === c.g.col) d += `<path d="M${X(k)} ${m} V${H}" stroke="${col(k)}"/>`;
    else if (before[k] != null && before[k] !== c.sha) d += `<path d="M${X(k)} ${m} V${H}" stroke="${col(k)}"/>`;
  });
  merges.forEach(k => d += `<path d="M${X(c.g.col)} ${m} C${X(c.g.col)} ${H} ${X(k)} ${m} ${X(k)} ${H}" stroke="${col(k)}"/>`);
  const cx = X(c.g.col);
  d += head ? `<circle cx="${cx}" cy="${m}" r="5" fill="var(--bg)" stroke="${col(c.g.col)}" stroke-width="2.5"/>` : `<circle cx="${cx}" cy="${m}" r="4" fill="${col(c.g.col)}"/>`;
  return `<svg width="${width}" height="${H}" fill="none" stroke-width="2">${d}</svg>`;
}

function sleepAudioSoon() { clearTimeout(audioNap); audioNap = setTimeout(() => { try { actx?.state === "running" && actx.suspend(); } catch {} }, 2000); }
document.addEventListener("pointerdown", unlockAudio, { passive: true });
// [Hz, start s, length s, wave]
const TUNES = {
  done: [[784, 0, .14], [1047, .13, .26]],                                       // up: finished
  waiting: [[880, 0, .16], [660, .19, .24], [880, .55, .16], [660, .74, .24]],   // ding-dong ×2: your turn
  error: [[330, 0, .2, "sawtooth"], [220, .22, .4, "sawtooth"]],                 // low and falling: something broke
};
TUNES.dialog = TUNES.waiting; TUNES.test = TUNES.done;
function playSound(kind) {
  if (!soundOn() || !actx) return;
  if (actx.state !== "running") { actx.resume().then(() => playSound(kind)).catch(() => {}); return; }   // napping between sounds
  const t0 = actx.currentTime + .02;
  for (const [f, at, len, type] of TUNES[kind] || TUNES.done) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t0 + at); g.gain.exponentialRampToValueAtTime(type ? .12 : .3, t0 + at + .015); g.gain.exponentialRampToValueAtTime(.0001, t0 + at + len);
    o.connect(g).connect(actx.destination); o.start(t0 + at); o.stop(t0 + at + len + .05);
  }
  sleepAudioSoon();
}
// without push the app still hears a room turn done / start waiting (with push, the service worker hands it over)
let lastStatus = null;
function soundOnChange(projects) {

  const before = lastStatus; lastStatus = now;
  if (!before || document.hidden || store.get("maw-push")) return;
  for (const [k, st] of now) if (before.has(k) && before.get(k) !== st && (st === "done" || st === "waiting")) return playSound(st);
}

// ── per-room drafts: typed text (localStorage) + attachments (Cache Storage) survive a page reload ──
const ATT_CACHE = "maw-att";
function saveDraftText(key, text) { if (text) store.set("maw-draft:" + key, text); else store.del("maw-draft:" + key); }
let attSaveSeq = 0;
async function saveDraftFiles(key, files) {
  if (!("caches" in window)) return;
  const seq = ++attSaveSeq;
  try {
    const box = await caches.open(ATT_CACHE), prefix = location.origin + "/att/" + encodeURIComponent(key) + "/";
    for (const k of await box.keys()) if (k.url.startsWith(prefix)) await box.delete(k);
    if (seq !== attSaveSeq) return;
    for (const [i, f] of files.entries()) await box.put(prefix + i, new Response(f, { headers: { "content-type": f.type || "application/octet-stream", "x-name": encodeURIComponent(f.name || "file") } }));
  } catch { /* storage full / private mode — still works in memory */ }
}
async function loadDraftFiles(key) {
  if (!("caches" in window)) return [];
  try {
    const box = await caches.open(ATT_CACHE), prefix = location.origin + "/att/" + encodeURIComponent(key) + "/";
    const keys = (await box.keys()).filter(k => k.url.startsWith(prefix)).sort((a, b) => +a.url.split("/").pop() - +b.url.split("/").pop());
    const out = [];
    for (const k of keys) { const r = await box.match(k); out.push(new File([await r.blob()], decodeURIComponent(r.headers.get("x-name") || "file"), { type: r.headers.get("content-type") || "" })); }
    return out;
  } catch { return []; }
}
async function restoreDraft(key, msg, drawAtt) {
  const text = store.get("maw-draft:" + key);
  if (text && !msg.value) { msg.value = text; msg.oninput(); }
  if (!state.files.length) {
    const files = await loadDraftFiles(key);
    if (files.length && state.filesRoom === key && !state.files.length) { state.files = files; drawAtt(); msg.oninput(); }
  }
}
function clearDraft(key) { store.del("maw-draft:" + key); saveDraftFiles(key, []); }

const SK_SRC = { builtin: "ในตัว", project: "โปรเจค", user: "ของฉัน", plugin: "plugin", prompt: "prompt", skill: "skill" };

  const TOKEN = /(^|\n)([\/$][\w:.\-]*)$/;
  const show = async () => {
    const before = msg.value.slice(0, msg.selectionStart ?? msg.value.length), m = TOKEN.exec(before);
    if (!m || (m[2][0] === "$" && room.agent !== "codex")) { box.hidden = true; return; }
    const all = await roomCommands(w, room);
    const hits = rankCmds(all.filter(c => c.insert[0] === m[2][0]), m[2].slice(1)).slice(0, 40);
    if (!hits.length) { box.hidden = true; return; }
    box.innerHTML = hits.map(cmdRow).join(""); box.hidden = false; box.scrollTop = 0;
    box.querySelectorAll("[data-ins]").forEach(b => { b.onpointerdown = e => e.preventDefault(); b.onclick = () => { insertCmd(msg, b.dataset.ins, TOKEN); box.hidden = true; }; });
  };
  const prev = msg.oninput;
  msg.oninput = () => { prev(); show(); };
  msg.addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== msg) box.hidden = true; }, 150));
  if (btn) btn.onclick = () => openSkillSheet(w, room, msg);
}
async function openSkillSheet(w, room, msg) {
  const all = await roomCommands(w, room);
  let src = "all";
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  const counts = all.reduce((a, c) => (a[c.source] = (a[c.source] || 0) + 1, a), {});
  bg.innerHTML = `<div class="sheet sk-sheet"><h2>สกิล & คำสั่ง</h2><div style="color:var(--dim);font-size:13px">${esc(agentLabel(room.agent))} · ${all.length} รายการ</div>
    <input id="skq" type="search" placeholder="ค้นหา เช่น rrr, review, deploy" autocomplete="off">
    <div class="sk-tabs"><button data-src="all" class="on">ทั้งหมด</button>${Object.keys(SK_SRC).filter(k => counts[k]).map(k => `<button data-src="${k}">${SK_SRC[k]} ${counts[k]}</button>`).join("")}</div>
    <div class="sk-list" id="skl"></div><button class="ghost" id="skc" style="margin-top:10px">ปิด</button></div>`;
  document.body.appendChild(bg);
  const q = bg.querySelector("#skq"), list = bg.querySelector("#skl");
  const draw = () => {
    const hits = rankCmds(all.filter(c => src === "all" || c.source === src), q.value.trim().replace(/^[\/$]/, ""));
    list.innerHTML = hits.map(cmdRow).join("") || `<div class="empty">ไม่พบ</div>`;
    list.querySelectorAll("[data-ins]").forEach(b => b.onclick = () => { bg.remove(); insertCmd(msg, b.dataset.ins, /(^|\n)([\/$][\w:.\-]*)$/); });
  };
  q.oninput = draw;
  bg.querySelectorAll("[data-src]").forEach(b => b.onclick = () => { src = b.dataset.src; bg.querySelectorAll("[data-src]").forEach(x => x.classList.toggle("on", x === b)); draw(); });
  bg.querySelector("#skc").onclick = () => bg.remove();
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  draw();
}

// ── new room sheet ──
async function openNewRoom(w) {
  const local = String(w.id).startsWith("dir:");
  if (!local && !state.presets.length) { try { state.presets = (await api("/agent-presets")).presets; } catch {} }
  const opts = local ? [{ id: "claude", label: ICON.claude || "✳ Claude" }, { id: "claude-switch", label: "✳ Claude ⇄ GPT" }, { id: "codex", label: ICON.codex || "Codex" }, { id: "shell", label: "⌨ Terminal เปล่า" }]
    : [...state.presets.map(p => ({ id: p.id, label: ICON[p.id] || p.label })), { id: "shell", label: "⌨ Terminal เปล่า" }];
  let pick = "claude";
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet"><h2>เปิดห้องใหม่</h2><div style="color:var(--dim);font-size:13px">${esc(state.project)} · ${esc(w.branch || w.name)}</div>
    <div class="grid">${opts.map(o => `<button class="opt ${o.id === pick ? "on" : ""}" data-o="${esc(o.id)}">${esc(o.label)}</button>`).join("")}</div>
    <textarea id="np" rows="4" placeholder="สั่งงานแรก เช่น แก้เทสที่ล้มในหน้า P7"></textarea>
    <button class="primary" id="go">เปิดห้อง</button><button class="ghost" id="cancel">ยกเลิก</button></div>`;
  document.body.appendChild(bg);
  const np = bg.querySelector("#np"), go = bg.querySelector("#go");
  const sync = () => { np.style.display = pick === "shell" ? "none" : ""; go.disabled = !local && pick !== "shell" && !np.value.trim(); };
  bg.querySelectorAll("[data-o]").forEach(b => b.onclick = () => { pick = b.dataset.o; bg.querySelectorAll("[data-o]").forEach(x => x.classList.toggle("on", x === b)); sync(); });
  np.oninput = sync; sync();
  bg.querySelector("#cancel").onclick = () => bg.remove();
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  go.onclick = async () => {
    if (!go.dataset.armed) { go.dataset.armed = 1; go.textContent = "แตะอีกครั้งเพื่อยืนยัน"; return; }
    go.disabled = true; go.textContent = "กำลังเปิด…";
    try {
      await api(`/workspaces/${encodeURIComponent(w.id)}/rooms`, { method: "POST", body: JSON.stringify({ agent: pick, prompt: np.value.trim() }) });
      bg.remove(); toast("เปิดห้องแล้ว"); await load();
      const ww = state.projects.find(x => x.name === state.project)?.workspaces.find(x => x.id === w.id);
      state.room = ww?.rooms[ww.rooms.length - 1]?.id || state.room; renderProject();
    } catch (e) { toast("เปิดไม่ได้: " + e.message); go.disabled = false; go.textContent = "เปิดห้อง"; delete go.dataset.armed; }
  };
}

// ── login fallback ──
function renderLogin() {
  clearInterval(timer);
  $app.dataset.view = ""; $app.innerHTML = `<div class="login"><h1>เชื่อมต่อ maw</h1>
    <div style="color:var(--dim)">เปิดผ่านลิงก์ <b>https://&lt;ชื่อเครื่อง&gt;.ts.net</b> ของ <code>tailscale serve</code> (ต่อ Tailscale) จะเข้าได้เลย · ถ้าเข้าจากที่อื่น วาง token จาก <code>~/.maw/mobile.json</code> บน Mac</div>
    <input id="tok" placeholder="token" autocomplete="off" autocapitalize="off" spellcheck="false" /><button id="save">บันทึก</button></div>`;
  document.getElementById("save").onclick = () => { store.set("maw-mobile-token", document.getElementById("tok").value.trim()); start(); };
}

// ── data + polling ──
/** Keep the remembered view's time current while the app is open (a page read for an hour is still "where I was"). */
function touchView() {
  if (!state.page && !state.project) return;
  try { const v = JSON.parse(store.get("maw-last-view") || "null"); if (v) { v.at = Date.now(); store.set("maw-last-view", JSON.stringify(v)); } } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.hidden) touchView(); });
async function load(manual) {
  touchView();
  try {
    state.projects = (await api("/projects")).projects;
    soundOnChange(state.projects);
    if (state.page) mawExt.refreshTiles(); else if (!state.project) renderHome(true); else if (!document.querySelector(".sheet-bg")) refreshTabs();
    syncPinnedDrawer();
    if (manual) toast("อัปเดตแล้ว");
  } catch (e) { if (e.message !== "unauthorized" && !e.offline) toast("โหลดไม่ได้: " + e.message); }
}
/** Update tab dots/titles without rebuilding the room (keeps a half-typed message). */
function refreshTabs() {
  const p = state.projects.find(x => x.name === state.project), w = p?.workspaces.find(x => x.id === state.ws);
  const tabs = document.getElementById("tabs"); if (!w || !tabs) return;
  const ids = [...tabs.querySelectorAll("[data-r]")].map(b => b.dataset.r).join(",");
  const currentRoom = w.rooms.find(r => r.id === state.room);
  const bindingChanged = p.source === "herdr" && renderProject.binding !== (currentRoom && chatBinding(w.id, currentRoom.id));
  if (bindingChanged || ids !== w.rooms.map(r => r.id).join(",")) {
    const draft = document.getElementById("msg")?.value;
    if (bindingChanged) { state.chat = null; state.open = new Set(); }
    const scroll = document.getElementById("screen")?.scrollTop, follow = state.follow;
    renderProject();
    if (draft) { const m = document.getElementById("msg"); if (m) { m.value = draft; m.oninput(); } }
    if (!bindingChanged && !follow && scroll !== undefined) { const scr = document.getElementById("screen"); if (scr) scr.scrollTop = scroll; }
    return;
  }
  // Preserve captured room closures while refreshing capabilities/status; identity was checked above.
  if (p.source === "herdr" && currentRoom) {
    if (renderProject.room) Object.assign(renderProject.room, currentRoom);
    syncHerdrControls(currentRoom);
    const status = document.getElementById("room-status"); if (status) status.innerHTML = `${dot(currentRoom.status)}${ST[currentRoom.status]}`;
  }
  for (const r of w.rooms) { const title = tabs.querySelector(`[data-r="${CSS.escape(r.id)}"] .t`); if (title) title.textContent = r.title; const b = tabs.querySelector(`[data-r="${CSS.escape(r.id)}"] .dot`); if (b) b.className = `dot s-${r.status}`; }
}
window.addEventListener("popstate", () => { if (state.project || state.page) renderHome(); state.lastRoomShown = null; });
// New version on the Mac → reload by itself (only when nothing is half-typed), so the phone never runs stale code
let pageStamp = null;
async function checkVersion() {
  try {
    const v = (await api("/version")).v; if (!v) return;
    if (pageStamp === null) { pageStamp = v; return; }
    if (v === pageStamp) return;
    const typing = document.getElementById("msg")?.value.trim() || state.files?.length || document.querySelector(".sheet-bg");
    if (typing) { toast("มีเวอร์ชันใหม่ — จะโหลดเมื่อช่องพิมพ์ว่าง"); return; }
    location.reload();
  } catch { /* offline */ }
}
setInterval(() => { if (!document.hidden) checkVersion(); }, 60_000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
checkVersion();
// ประหยัดเน็ต: ห้อง/หน้าแรกที่นิ่ง ถามห่างขึ้น — ไม่มีอะไรเปลี่ยนและไม่ได้แตะจอ 30 วิ → ทุก 5 วิ · 2 นาที → ทุก 10 วิ
// agent กำลังทำ/รอตอบ · สถานะห้องไหนเปลี่ยน · แชทมีของใหม่ · แตะ/พิมพ์ · กลับมาเปิดแอป → กลับไปทุก 2.5 วิทันที
const pace = { last: Date.now(), at: 0, sig: "" };
const paceBump = () => { pace.last = Date.now(); };
["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, paceBump, { passive: true, capture: true }));
document.addEventListener("visibilitychange", () => { if (!document.hidden) paceBump(); });
function pollGap() {
  // only the rooms on this screen count (another project's busy room must not keep this one fast)
  const rooms = state.projects.flatMap(p => p.workspaces.flatMap(w => w.rooms));
  const here = state.room ? rooms.filter(r => r.id === state.room) : state.project ? [] : rooms;
  const sig = here.map(r => r.id + ":" + r.status).join(",");
  if (sig !== pace.sig) { pace.sig = sig; paceBump(); }
  if (here.some(r => r.agent && (r.status === "working" || r.status === "waiting"))) return 2500;
  const quiet = Date.now() - pace.last;
  return quiet < 30_000 ? 2500 : quiet < 120_000 ? 5000 : 10_000;
}
function start() {
  clearInterval(timer); clearInterval(start._sys);
  if (!start._pend) { start._pend = 1; restorePending().catch(() => {}); resumeLast().catch(() => {}); }
  load(); loadSys(); takeShared(); takeOpen(); start._sys = setInterval(() => { if (!document.hidden) loadSys(); }, 10_000);
  timer = setInterval(() => {
    if (document.hidden) return;
    if (Date.now() - pace.at < pollGap() - 200) return;
    pace.at = Date.now();
    if (state.project && state.room) loadScreen();
    load();
  }, 2500);
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
start();
