<title>maw</title>
<!--
  Phone UI for maw, laid out like Superset: projects → workspace → rooms as tabs (+ open a new room).
  Rooms = every Superset terminal (Claude, Codex, any agent, plain shell) + tmux panes running Claude.
  Talks only to /mobile/* (src/mobile/api.ts). Plan: ~/oracle/ψ/incubate/Soul-Brews-Studio/maw-js/PLAN-maw-mobile.md
  Source: ui/mobile/m.html in the fork → copied to ~/.maw/ui/dist/m.html
-->
<style>
  :root {
    --bg: #020208; --card: #0d0f1a; --card2: #141729; --line: #1f2337; --text: #e6e8f2; --dim: #8a90a8;
    --working: #22c55e; --waiting: #f59e0b; --done: #38bdf8; --idle: #64748b; --ended: #3b3f52; --accent: #60a5fa; --danger: #ef4444;
    --font: -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", "Sarabun", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, "Noto Sans Mono", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
  body { padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .app { display: flex; flex-direction: column; height: 100%; padding-top: env(safe-area-inset-top); }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex: none; }
  header h1 { font-size: 18px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn { min-width: 40px; height: 40px; padding: 0 10px; border-radius: 12px; background: var(--card2); display: grid; place-items: center; font-size: 15px; flex: none; }
  main { flex: 1; overflow-y: auto; padding: 4px 12px 24px; }
  .section { color: var(--dim); font-size: 12px; letter-spacing: .06em; margin: 16px 4px 4px; }
  .card { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 13px 14px; margin: 8px 0; }
  .card:active { background: var(--card2); }
  .row { display: flex; align-items: center; gap: 8px; }

  .sub { color: var(--dim); font-size: 12.5px; margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }

  .s-done { background: var(--done); } .s-idle { background: var(--idle); } .s-ended { background: var(--ended); }
  @keyframes pulse { 50% { opacity: .35 } }
  .waitcard { border-color: #5a3d0a; }
  .empty { color: var(--dim); text-align: center; padding: 40px 16px; }
  .wsbar { display: flex; gap: 6px; padding: 8px 12px 0; overflow-x: auto; flex: none; scrollbar-width: none; }
  .tabs { display: flex; gap: 5px; padding: 6px 12px; overflow-x: auto; flex: none; scrollbar-width: none; border-bottom: 1px solid var(--line); }
  .tab { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 9px; background: var(--card2); color: var(--dim); white-space: nowrap; max-width: 200px; flex: none; font-size: 13px; }

  .tab.add { background: var(--accent); color: #031022; font-weight: 800; padding: 6px 12px; }

  .chip.on { background: var(--accent); color: #031022; font-weight: 600; }
  .agentico { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: #ffffff12; color: #cbd5e1; flex: none; }
  .screen { flex: 1; overflow: auto; margin: 8px 12px 0; background: #05060d; border: 1px solid var(--line); border-radius: 12px; padding: 10px;
            font: 12px/1.35 var(--mono); white-space: pre-wrap; word-break: break-word; }
  .screen.raw { white-space: pre; overflow-x: auto; word-break: normal; }
  .screen.chat { font: 15px/1.6 var(--font); white-space: normal; padding: 10px 8px 16px; background: var(--bg); border-color: transparent; }

  .msg.ai .bubble { background: var(--card); border: 1px solid var(--line); border-radius: 4px 18px 18px 18px; max-width: 100%; }
  .bubble { padding: 10px 14px; overflow-wrap: anywhere; }
  /* ── reading typography for agent replies ── */
  .msg .bubble { font-size: 14px; line-height: 1.6; } .msg.ai .bubble { line-height: 1.65; }
  .bubble > :first-child { margin-top: 0 !important; } .bubble > :last-child { margin-bottom: 0 !important; }
  .bubble p { margin: 0 0 10px; }
  .bubble .mh { color: #fff; line-height: 1.35; text-wrap: balance; }

  .bubble h3.mh { font-size: 15px; margin: 16px 0 6px; }

  .bubble hr { border: 0; border-top: 1px dashed #2a2f4a; margin: 14px 0; }
  .bubble ul, .bubble ol { margin: 4px 0 10px; padding-left: 22px; } .bubble li { margin: 3px 0; } .bubble li > ul, .bubble li > ol { margin: 2px 0 4px; }
  .bubble li::marker { color: #7c86b0; } .bubble ol > li::marker { font-weight: 700; font-variant-numeric: tabular-nums; }
  .bubble .task { font-size: 16px; color: #8a90a8; } .bubble .task.done { color: #4ade80; }
  .bubble blockquote { margin: 10px 0; padding: 6px 12px; border-left: 3px solid #4b5578; color: #c3c9de; background: #ffffff06; border-radius: 0 8px 8px 0; }
  .callout { margin: 12px 0; padding: 8px 12px 10px; border-radius: 10px; border: 1px solid; }

  .callout.caution { background: #ef444412; border-color: #ef444455; } .callout.caution .ct { color: #f87171; }
  .bubble code { font: 12px var(--mono); background: #ffffff14; padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
  .bubble pre { font: 11.5px/1.5 var(--mono); background: #05060d; border: 1px solid var(--line); padding: 10px; border-radius: 8px; overflow-x: auto; white-space: pre; margin: 8px 0; }
  .code-b { margin: 8px 0; } .code-b pre { margin: 0; padding-top: 24px; }
  .code-b .lang { position: absolute; top: 5px; left: 10px; font: 600 10.5px var(--mono); color: #7c86b0; text-transform: uppercase; letter-spacing: .06em; z-index: 1; }
  .d-add { color: #86efac; background: #16a34a1f; display: inline-block; min-width: 100%; } .d-del { color: #fca5a5; background: #dc26261f; display: inline-block; min-width: 100%; } .d-hunk { color: #7dd3fc; }
  .tblwrap { overflow-x: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 10px; }
  .bubble table { border-collapse: collapse; font-size: 12.5px; line-height: 1.5; width: max-content; min-width: 100%; }
  .bubble th, .bubble td { padding: 7px 10px; text-align: left; vertical-align: top; min-width: 4.5em; max-width: 17em; word-break: normal; overflow-wrap: break-word; border-bottom: 1px solid var(--line); }
  .bubble th { white-space: nowrap; background: #ffffff0d; color: #e6e8f2; font-weight: 700; font-size: 12.5px; }
  .bubble tbody tr:nth-child(even) td { background: #ffffff05; } .bubble tbody tr:last-child td { border-bottom: 0; }
  .bubble td + td, .bubble th + th { border-left: 1px solid #ffffff0a; }
  .bubble td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .bubble td:first-child { color: #e6e8f2; }
  .tbody pre.log .l-err { color: #fca5a5; background: #dc262618; } .tbody pre.log .l-warn { color: #fcd34d; } .tbody pre.log .l-ok { color: #86efac; }
  .bubble a { color: var(--accent); }
  .more { color: #bfdbfe; text-decoration: underline; font-size: 13px; display: inline-block; margin-top: 4px; }
  details.tool { margin: 3px 0 3px 6px; border-radius: 10px; font-size: 13px; }

  details.tool.agent > summary { background: #1b1233; border-color: #3b2a66; color: #d8ccff; }
  details.tool[open] > summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .tbody { border: 1px solid #171a2b; border-top: 0; border-radius: 0 0 10px 10px; padding: 8px; background: #05060d; }
  .tbody .lbl { color: var(--dim); font-size: 11px; margin: 4px 0 2px; }
  .tbody pre { font: 11.5px/1.45 var(--mono); white-space: pre; overflow-x: auto; margin: 0; max-height: 50vh; overflow-y: auto; color: #cbd5e1; }
  details.tgroup { margin: 4px 0 4px 6px; }

const store = { get: k => { try { return localStorage.getItem(k) } catch { return null } }, set: (k, v) => { try { localStorage.setItem(k, v) } catch {} }, del: k => { try { localStorage.removeItem(k) } catch {} } };

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ── home: projects ──

function score(p) { const r = roomsOf(p); return r.filter(x => x.status === "waiting").length * 100 + r.filter(x => x.status === "working").length * 10 + r.filter(x => x.agent).length; }

  d += head ? `<circle cx="${cx}" cy="${m}" r="5" fill="var(--bg)" stroke="${col(c.g.col)}" stroke-width="2.5"/>` : `<circle cx="${cx}" cy="${m}" r="4" fill="${col(c.g.col)}"/>`;

async function takeShared() {

    files.push(new File([await r.blob()], decodeURIComponent(r.headers.get("x-name") || "file"), { type: r.headers.get("content-type") || "" }));
  }

  const dbg = await box.match("/shared/debug"); if (dbg) console.info("[share]", await dbg.text());
  for (const k of await box.keys()) if (!k.url.endsWith("/shared/debug")) await box.delete(k);
  if (!files.length && !text) { toast("แชร์มาแต่ไม่มีไฟล์ — ลองแชร์ใหม่อีกครั้ง"); return; }

    .sort((a, b) => (b.r.status === "waiting") - (a.r.status === "waiting"));
  // Android adds the screenshot's own title ("Screenshot (22 ต.ค. 2026 17:32:07)") as text — that's noise, drop it
  const note = files.length && /^(Screenshot|ภาพหน้าจอ|IMG|Screen ?shot)[\s_(]/i.test(text) ? "" : text;

// ── ANSI colours → HTML for the raw "จอ" view (SGR: 16/256/truecolor, bold, dim, italic, underline, inverse) ──
const ANSI16 = ["#1e1e2e", "#f38ba8", "#a6e3a1", "#f9e2af", "#89b4fa", "#f5c2e7", "#94e2d5", "#bac2de", "#585b70", "#f38ba8", "#a6e3a1", "#f9e2af", "#89b4fa", "#f5c2e7", "#94e2d5", "#e6e8f2"];

  n -= 16; const c = x => (x ? 55 + x * 40 : 0);
  return `rgb(${c(Math.floor(n / 36))},${c(Math.floor(n / 6) % 6)},${c(n % 6)})`;
}
function ansiHtml(src) {
  let st = {}, out = "";
  const open = () => {
    let fg = st.fg, bg = st.bg; if (st.inv) [fg, bg] = [bg || "#e6e8f2", fg || "#05060d"];
    const css = [fg && `color:${fg}`, bg && `background:${bg}`, st.b && "font-weight:700", st.dim && "opacity:.6", st.it && "font-style:italic", st.ul && "text-decoration:underline"].filter(Boolean).join(";");
    return css ? `<span style="${css}">` : "<span>";
  };
  const parts = String(src).split(/(\x1b\[[0-9;:?]*[ -\/]*[@-~])/);
  for (const part of parts) {
    const m = /^\x1b\[([0-9;:]*)m$/.exec(part);
    if (!m) { if (part && part[0] !== "\x1b") out += open() + esc(part) + "</span>"; continue; }
    const a = (m[1] || "0").split(/[;:]/).map(Number);
    for (let i = 0; i < a.length; i++) {
      const c = a[i];
      if (c === 0) st = {}; else if (c === 1) st.b = 1; else if (c === 2) st.dim = 1; else if (c === 3) st.it = 1; else if (c === 4) st.ul = 1; else if (c === 7) st.inv = 1;
      else if (c === 22) st.b = st.dim = 0; else if (c === 23) st.it = 0; else if (c === 24) st.ul = 0; else if (c === 27) st.inv = 0;
      else if (c >= 30 && c <= 37) st.fg = ANSI16[c - 30]; else if (c >= 90 && c <= 97) st.fg = ANSI16[c - 82];
      else if (c >= 40 && c <= 47) st.bg = ANSI16[c - 40]; else if (c >= 100 && c <= 107) st.bg = ANSI16[c - 92];
      else if (c === 39) st.fg = 0; else if (c === 49) st.bg = 0;
      else if ((c === 38 || c === 48) && a[i + 1] === 5) { st[c === 38 ? "fg" : "bg"] = ansi256(a[i + 2]); i += 2; }
      else if ((c === 38 || c === 48) && a[i + 1] === 2) { st[c === 38 ? "fg" : "bg"] = `rgb(${a[i + 2]},${a[i + 3]},${a[i + 4]})`; i += 4; }
    }
  }
  return out;
}

let actx = null;

// [Hz, start s, length s, wave]
const TUNES = {
  done: [[784, 0, .14], [1047, .13, .26]],                                       // up: finished
  waiting: [[880, 0, .16], [660, .19, .24], [880, .55, .16], [660, .74, .24]],   // ding-dong ×2: your turn
  error: [[330, 0, .2, "sawtooth"], [220, .22, .4, "sawtooth"]],                 // low and falling: something broke
};
TUNES.dialog = TUNES.waiting; TUNES.test = TUNES.done;

  if (!soundOn() || !actx || actx.state !== "running") return;
  const t0 = actx.currentTime + .02;
  for (const [f, at, len, type] of TUNES[kind] || TUNES.done) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t0 + at); g.gain.exponentialRampToValueAtTime(type ? .12 : .3, t0 + at + .015); g.gain.exponentialRampToValueAtTime(.0001, t0 + at + len);
    o.connect(g).connect(actx.destination); o.start(t0 + at); o.stop(t0 + at + len + .05);

}

// ── per-room drafts: typed text (localStorage) + attachments (Cache Storage) survive a page reload ──
const ATT_CACHE = "maw-att";
function saveDraftText(key, text) { if (text) store.set("maw-draft:" + key, text); else store.del("maw-draft:" + key); }
let attSaveSeq = 0;
async function saveDraftFiles(key, files) {
  if (!("caches" in window)) return;
  const seq = ++attSaveSeq;
  try {
    const box = await caches.open(ATT_CACHE), prefix = location.origin + "/att/" + encodeURIComponent(key) + "/";
    for (const k of await box.keys()) if (k.url.startsWith(prefix)) await box.delete(k);
    if (seq !== attSaveSeq) return;
    for (const [i, f] of files.entries()) await box.put(prefix + i, new Response(f, { headers: { "content-type": f.type || "application/octet-stream", "x-name": encodeURIComponent(f.name || "file") } }));
  } catch { /* storage full / private mode — still works in memory */ }
}
async function loadDraftFiles(key) {
  if (!("caches" in window)) return [];
  try {
    const box = await caches.open(ATT_CACHE), prefix = location.origin + "/att/" + encodeURIComponent(key) + "/";
    const keys = (await box.keys()).filter(k => k.url.startsWith(prefix)).sort((a, b) => +a.url.split("/").pop() - +b.url.split("/").pop());
    const out = [];
    for (const k of keys) { const r = await box.match(k); out.push(new File([await r.blob()], decodeURIComponent(r.headers.get("x-name") || "file"), { type: r.headers.get("content-type") || "" })); }
    return out;
  } catch { return []; }
}

}

        <button data-a="pin">📌 ${x.pinned ? "เปิดโปรเจคที่ปักไว้" : "ปักไว้ในแอป"}<small>ขึ้นเป็นโปรเจคในหน้าแรก มีแท็บ 📁 ไฟล์ · ⎇ Git</small></button>
        <div style="padding:10px;border-radius:12px;background:var(--card2)"><b>▶ เปิดห้องใหม่ที่นี่ (tmux)</b>
          <div class="op-agents" style="margin-top:8px"><button data-ag="claude" class="on">✳ Claude</button><button data-ag="codex">Codex</button><button data-ag="shell">⌨ Terminal</button></div>
          <textarea id="opp" rows="2" placeholder="สั่งงานแรก (ไม่ใส่ก็ได้)" style="margin-top:8px"></textarea>
          <button data-a="room" style="margin-top:8px;width:100%;padding:11px;border-radius:10px;background:var(--accent);color:#031022;font-weight:700">▶ เปิดห้อง</button></div>
        ${x.git !== false ? `<button data-a="ss">＋ เพิ่มเข้า Superset<small>superset projects create --import · ใช้ workspace/branch แยกของ Superset ได้</small></button>` : ""}
        <button class="ghost" data-a="back">← กลับไปเลือก</button></div>`;
    body.querySelectorAll("[data-ag]").forEach(b => b.onclick = () => { agent = b.dataset.ag; body.querySelectorAll("[data-ag]").forEach(y => y.classList.toggle("on", y === b)); body.querySelector("#opp").style.display = agent === "shell" ? "none" : ""; });
    const pinAndOpen = async (room) => {
      const r = await api("/local/folders", { method: "POST", body: JSON.stringify({ path: x.path, name: x.name }) });
      await load();
      const p = state.projects.find(q => q.workspaces.some(w => w.id === r.id));
      if (!p) return toast("ปักแล้ว");
      bg.remove(); state.project = p.name; state.ws = r.id; state.pview = "rooms"; state.room = room || p.workspaces[0].rooms.at(-1)?.id || null; state.chat = null;
      history.pushState({ v: "p" }, ""); renderProject();
    };
    body.querySelector('[data-a="back"]').onclick = () => draw();
    body.querySelector('[data-a="pin"]').onclick = async e => { e.currentTarget.disabled = true; try { await pinAndOpen(); } catch (err) { toast(err.message); } };
    body.querySelector('[data-a="room"]').onclick = async e => {
      const b = e.currentTarget; if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = "แตะอีกครั้งเพื่อเปิดห้อง"; return; }
      b.disabled = true; b.textContent = "กำลังเปิด…";
      try {
        const r = await api(`/workspaces/${encodeURIComponent(dirIdOf(x.path))}/rooms`, { method: "POST", body: JSON.stringify({ agent, prompt: body.querySelector("#opp").value.trim() }) });
        await new Promise(res => setTimeout(res, 1200));
        await pinAndOpen(r.result?.pane); toast("เปิดห้องแล้ว");
      } catch (err) { toast("เปิดไม่ได้: " + err.message); b.disabled = false; b.textContent = "เปิดห้อง"; delete b.dataset.armed; }
    };
    body.querySelector('[data-a="ss"]')?.addEventListener("click", async e => {
      const b = e.currentTarget; if (!b.dataset.armed) { b.dataset.armed = 1; b.firstChild.textContent = "แตะอีกครั้ง: เพิ่ม " + x.name + " เข้า Superset"; return; }
      b.disabled = true;
      try { await api("/local/superset-import", { method: "POST", body: JSON.stringify({ path: x.path, name: x.name }) }); bg.remove(); toast("เพิ่มเข้า Superset แล้ว"); await load(); renderHome(); }
      catch (err) { toast("เพิ่มไม่ได้: " + err.message); b.disabled = false; }
    });
  }
  draw();
}
document.addEventListener("click", async e => {
  const b = e.target.closest && e.target.closest("[data-unpin]"); if (!b) return;
  e.stopPropagation();
  if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = "เลิกปัก?"; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = "📌"; } }, 3000); return; }
  try { await api("/local/folders", { method: "POST", body: JSON.stringify({ path: b.dataset.unpin, pin: false }) }); toast("เลิกปักแล้ว (ไฟล์ไม่ถูกลบ)"); history.back(); await load(); renderHome(); } catch (err) { toast(err.message); }
}, true);

// ── "/" picker: skills + slash commands, like typing "/" in Claude Code ──
const SK_SRC = { builtin: "ในตัว", project: "โปรเจค", user: "ของฉัน", plugin: "plugin", prompt: "prompt", skill: "skill" };
function roomCommands(w, room) {
  state.cmds = state.cmds || {};
  const k = w.id + "|" + room.id;
  if (!state.cmds[k]) state.cmds[k] = api(`/rooms/${encodeURIComponent(w.id)}/${encodeURIComponent(room.id)}/commands?agent=${encodeURIComponent(room.agent || "claude")}`).then(r => r.commands || []).catch(() => { delete state.cmds[k]; return []; });
  return state.cmds[k];
}
function rankCmds(list, q) {
  q = q.toLowerCase();
  return list.map(c => { const n = c.name.toLowerCase(); return [!q ? 1 : n.startsWith(q) ? 0 : n.includes(q) ? 2 : (c.desc || "").toLowerCase().includes(q) ? 3 : 9, c]; })
    .filter(x => x[0] < 9).sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name)).map(x => x[1]);
}
const cmdRow = c => `<button class="sc" data-ins="${esc(c.insert)}"><span class="sn">${esc(c.insert)}</span><span class="ss s-${c.source}">${SK_SRC[c.source] || c.source}</span>${c.desc ? `<span class="sd">${esc(c.desc)}</span>` : ""}</button>`;
function insertCmd(msg, ins, tokenRe) {
  const pos = msg.selectionStart ?? msg.value.length, before = msg.value.slice(0, pos), after = msg.value.slice(pos);
  const m = tokenRe && tokenRe.exec(before);
  const head = m ? before.slice(0, before.length - m[2].length) : (before && !/\s$/.test(before) ? before + " " : before);
  msg.value = head + ins + " " + after.replace(/^\S*/, "").replace(/^\s+/, "");
  const at = (head + ins + " ").length; msg.focus(); msg.setSelectionRange(at, at); msg.oninput();
}
function wireSlash(w, room, msg) {
  const box = document.getElementById("slash"), btn = document.getElementById("skbtn");
  if (!box) return;
  const TOKEN = /(^|\n)([\/$][\w:.\-]*)$/;
  const show = async () => {
    const before = msg.value.slice(0, msg.selectionStart ?? msg.value.length), m = TOKEN.exec(before);
    if (!m || (m[2][0] === "$" && room.agent !== "codex")) { box.hidden = true; return; }
    const all = await roomCommands(w, room);
    const hits = rankCmds(all.filter(c => c.insert[0] === m[2][0]), m[2].slice(1)).slice(0, 40);
    if (!hits.length) { box.hidden = true; return; }
    box.innerHTML = hits.map(cmdRow).join(""); box.hidden = false; box.scrollTop = 0;
    box.querySelectorAll("[data-ins]").forEach(b => { b.onpointerdown = e => e.preventDefault(); b.onclick = () => { insertCmd(msg, b.dataset.ins, TOKEN); box.hidden = true; }; });
  };
  const prev = msg.oninput;
  msg.oninput = () => { prev(); show(); };
  msg.addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== msg) box.hidden = true; }, 150));
  if (btn) btn.onclick = () => openSkillSheet(w, room, msg);
}
async function openSkillSheet(w, room, msg) {
  const all = await roomCommands(w, room);
  let src = "all";
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  const counts = all.reduce((a, c) => (a[c.source] = (a[c.source] || 0) + 1, a), {});
  bg.innerHTML = `<div class="sheet sk-sheet"><h2>สกิล & คำสั่ง</h2><div style="color:var(--dim);font-size:13px">${esc(agentLabel(room.agent))} · ${all.length} รายการ</div>
    <input id="skq" type="search" placeholder="ค้นหา เช่น rrr, review, deploy" autocomplete="off">
    <div class="sk-tabs"><button data-src="all" class="on">ทั้งหมด</button>${Object.keys(SK_SRC).filter(k => counts[k]).map(k => `<button data-src="${k}">${SK_SRC[k]} ${counts[k]}</button>`).join("")}</div>
    <div class="sk-list" id="skl"></div><button class="ghost" id="skc" style="margin-top:10px">ปิด</button></div>`;
  document.body.appendChild(bg);
  const q = bg.querySelector("#skq"), list = bg.querySelector("#skl");
  const draw = () => {
    const hits = rankCmds(all.filter(c => src === "all" || c.source === src), q.value.trim().replace(/^[\/$]/, ""));
    list.innerHTML = hits.map(cmdRow).join("") || `<div class="empty">ไม่พบ</div>`;
    list.querySelectorAll("[data-ins]").forEach(b => b.onclick = () => { bg.remove(); insertCmd(msg, b.dataset.ins, /(^|\n)([\/$][\w:.\-]*)$/); });
  };
  q.oninput = draw;
  bg.querySelectorAll("[data-src]").forEach(b => b.onclick = () => { src = b.dataset.src; bg.querySelectorAll("[data-src]").forEach(x => x.classList.toggle("on", x === b)); draw(); });
  bg.querySelector("#skc").onclick = () => bg.remove();
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  draw();
}

// ── new room sheet ──
async function openNewRoom(w) {
  const local = String(w.id).startsWith("dir:");
  if (!local && !state.presets.length) { try { state.presets = (await api("/agent-presets")).presets; } catch {} }
  const opts = local ? [{ id: "claude", label: ICON.claude || "✳ Claude" }, { id: "codex", label: ICON.codex || "Codex" }, { id: "shell", label: "⌨ Terminal เปล่า" }]
    : [...state.presets.map(p => ({ id: p.id, label: ICON[p.id] || p.label })), { id: "shell", label: "⌨ Terminal เปล่า" }];
  let pick = "claude";
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet"><h2>เปิดห้องใหม่</h2><div style="color:var(--dim);font-size:13px">${esc(state.project)} · ${esc(w.branch || w.name)}</div>
    <div class="grid">${opts.map(o => `<button class="opt ${o.id === pick ? "on" : ""}" data-o="${esc(o.id)}">${esc(o.label)}</button>`).join("")}</div>
    <textarea id="np" rows="4" placeholder="สั่งงานแรก เช่น แก้เทสที่ล้มในหน้า P7"></textarea>
    <button class="primary" id="go">เปิดห้อง</button><button class="ghost" id="cancel">ยกเลิก</button></div>`;
  document.body.appendChild(bg);
  const np = bg.querySelector("#np"), go = bg.querySelector("#go");
  const sync = () => { np.style.display = pick === "shell" ? "none" : ""; go.disabled = !local && pick !== "shell" && !np.value.trim(); };
  bg.querySelectorAll("[data-o]").forEach(b => b.onclick = () => { pick = b.dataset.o; bg.querySelectorAll("[data-o]").forEach(x => x.classList.toggle("on", x === b)); sync(); });
  np.oninput = sync; sync();
  bg.querySelector("#cancel").onclick = () => bg.remove();
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  go.onclick = async () => {
    if (!go.dataset.armed) { go.dataset.armed = 1; go.textContent = "แตะอีกครั้งเพื่อยืนยัน"; return; }
    go.disabled = true; go.textContent = "กำลังเปิด…";
    try {
      await api(`/workspaces/${encodeURIComponent(w.id)}/rooms`, { method: "POST", body: JSON.stringify({ agent: pick, prompt: np.value.trim() }) });
      bg.remove(); toast("เปิดห้องแล้ว"); await load();
      const ww = state.projects.find(x => x.name === state.project)?.workspaces.find(x => x.id === w.id);
      state.room = ww?.rooms[ww.rooms.length - 1]?.id || state.room; renderProject();
    } catch (e) { toast("เปิดไม่ได้: " + e.message); go.disabled = false; go.textContent = "เปิดห้อง"; delete go.dataset.armed; }
  };
}

// ── login fallback ──
function renderLogin() {
  clearInterval(timer);
  $app.innerHTML = `<div class="login"><h1>เชื่อมต่อ maw</h1>
    <div style="color:var(--dim)">เปิดผ่านลิงก์ <b>https://&lt;ชื่อเครื่อง&gt;.ts.net</b> ของ <code>tailscale serve</code> (ต่อ Tailscale) จะเข้าได้เลย · ถ้าเข้าจากที่อื่น วาง token จาก <code>~/.maw/mobile.json</code> บน Mac</div>
    <input id="tok" placeholder="token" autocomplete="off" autocapitalize="off" spellcheck="false" /><button id="save">บันทึก</button></div>`;
  document.getElementById("save").onclick = () => { store.set("maw-mobile-token", document.getElementById("tok").value.trim()); start(); };
}

// ── data + polling ──
async function load(manual) {
  try {
    state.projects = (await api("/projects")).projects;
    soundOnChange(state.projects);
    if (!state.project) renderHome(); else if (!document.querySelector(".sheet-bg")) refreshTabs();
    if (manual) toast("อัปเดตแล้ว");
  } catch (e) { if (e.message !== "unauthorized") toast("โหลดไม่ได้: " + e.message); }
}
/** Update tab dots/titles without rebuilding the room (keeps a half-typed message). */
function refreshTabs() {
  const p = state.projects.find(x => x.name === state.project), w = p?.workspaces.find(x => x.id === state.ws);
  const tabs = document.getElementById("tabs"); if (!w || !tabs) return;
  const ids = [...tabs.querySelectorAll("[data-r]")].map(b => b.dataset.r).join(",");
  if (ids !== w.rooms.map(r => r.id).join(",")) {
    const draft = document.getElementById("msg")?.value; renderProject();
    if (draft) { const m = document.getElementById("msg"); if (m) { m.value = draft; m.oninput(); } }
    return;
  }
  for (const r of w.rooms) { const b = tabs.querySelector(`[data-r="${CSS.escape(r.id)}"] .dot`); if (b) b.className = `dot s-${r.status}`; }
}
window.addEventListener("popstate", () => { if (state.project) renderHome(); state.lastRoomShown = null; });
// New version on the Mac → reload by itself (only when nothing is half-typed), so the phone never runs stale code
let pageStamp = null;
async function checkVersion() {
  try {
    const v = (await api("/version")).v; if (!v) return;
    if (pageStamp === null) { pageStamp = v; return; }
    if (v === pageStamp) return;
    const typing = document.getElementById("msg")?.value.trim() || state.files?.length || document.querySelector(".sheet-bg");
    if (typing) { toast("มีเวอร์ชันใหม่ — จะโหลดเมื่อช่องพิมพ์ว่าง"); return; }
    location.reload();
  } catch { /* offline */ }
}
setInterval(() => { if (!document.hidden) checkVersion(); }, 60_000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
checkVersion();
function start() {
  clearInterval(timer); clearInterval(start._sys);
  load(); loadSys(); takeShared(); takeOpen(); start._sys = setInterval(() => { if (!document.hidden) loadSys(); }, 10_000);
  timer = setInterval(() => {
    if (document.hidden) return;
    if (state.project && state.room) loadScreen();
    load();
  }, 2500);
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
start();
