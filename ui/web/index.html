<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#020208" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>ARRA Office</title>
  <script>
    // A phone opening the desktop office goes to maw mobile (/m.html) instead.
    // ?desktop=1 keeps the desktop view for this tab.
    (function () {
      try {
        var q = location.search;
        if (/[?&]desktop=1\b/.test(q)) { sessionStorage.setItem("maw-desktop", "1"); return; }
        if (sessionStorage.getItem("maw-desktop") === "1" || /[?&]host=/.test(q)) return;
        var phone = matchMedia("(pointer: coarse)").matches && Math.min(screen.width, screen.height) < 600;
        if (phone) location.replace("/m.html");
      } catch (e) { /* stay on the desktop view */ }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
